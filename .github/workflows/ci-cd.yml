name: CI/CD Backend

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Build & Test
        run: mvn -B clean test package

      - name: Upload jar artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-jar
          path: target/*.jar

  deploy-ec2:
    needs: build-test
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    steps:
      - name: Download jar artifact
        uses: actions/download-artifact@v4
        with:
          name: app-jar
          path: target

      - name: Copy jar to EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          source: "target/*.jar"
          target: ${{ secrets.EC2_APP_DIR }}

      - name: Activate jar + restart service
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            set -e
            cd "${{ secrets.EC2_APP_DIR }}"

            echo "Contenido en EC2:"
            ls -lah
            echo "Buscando jar..."
            find . -maxdepth 3 -type f -name "*.jar" -print

            JAR=$(find . -maxdepth 3 -type f -name "*.jar" | head -n 1)
            echo "Jar encontrado: $JAR"

            sudo mv -f "$JAR" "${{ secrets.EC2_APP_DIR }}/app.jar"
            sudo systemctl restart "${{ secrets.EC2_SERVICE }}"
            sudo systemctl --no-pager status "${{ secrets.EC2_SERVICE }}" | tail -n 80  